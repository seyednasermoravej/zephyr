# Use the credentials saved in NVS to join the local Wi-Fi network.
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_USAGE_MODE_STA=y
# A missing saved AP must leave the station available for shell provisioning.
# Retrying while CONNECTING otherwise rejects new credentials with EALREADY.
CONFIG_ESP32_WIFI_STA_RECONNECT=n
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT_EVENT_INFO=y

# main() loads saved credentials before initiating Wi-Fi and DHCP.
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_NEED_IPV4=n

# The sample's 128 buffers per direction exceed internal RAM with Wi-Fi.
# 64 buffers keep room for the HTTP/NVS stacks and eight HTTP clients.
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Browsers retain parallel connections; leave capacity for other API clients.
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=3

# Serial-console provisioning remains available before credentials are saved.
CONFIG_NET_L2_WIFI_SHELL=y
# Allow crowded Wi-Fi environments time to process management events.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
